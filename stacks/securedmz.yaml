version: '3.8'

# ===============================
# 1. RÉSEAUX
# ===============================
networks:
  dmz_net:
    name: dmz_net
    driver: bridge
  internal_net:
    name: internal_net
    driver: bridge

# ===============================
# 2. SERVICES
# ===============================
services:

  dashboard:
    image: nginx:alpine
    container_name: homelab_dashboard
    restart: unless-stopped
    ports:
      - "8089:80"
    volumes:
      - /docker/services/homelab-dashboard:/usr/share/nginx/html:ro
    networks:
      - dmz_net

  cadvisor:
   image: gcr.io/cadvisor/cadvisor:latest
   container_name: cadvisor
   restart: unless-stopped
   volumes:
     - /:/rootfs:ro
     - /var/run:/var/run:rw
     - /sys:/sys:ro
     - /var/lib/docker/:/var/lib/docker:ro
     - /dev/disk/:/dev/disk:ro
   ports:
     - 8098:8080
   networks:
     - internal_net
  flaresolverr:
   image: ghcr.io/flaresolverr/flaresolverr:latest
   container_name: flaresolverr
   restart: unless-stopped
   dns:
     - 1.1.1.1
     - 8.8.8.8
   environment:
     - TZ=${TZ}
   networks:
     - internal_net
     - dmz_net
   ports:
     - 8191:8191

  qui:
    image: ghcr.io/autobrr/qui:latest
    container_name: qui
    restart: unless-stopped
    ports:
      - "7476:7476"
    volumes:
      # On pointe vers le chemin absolu standardisé
      - /docker/services/qui:/config
    environment:
      - TZ=Europe/Paris
      - PUID=${PUID}
      - PGID=${PGID}

  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    ports:
      - "8090:80"

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8088:8080
    networks:
      - dmz_net
    restart: unless-stopped

  glances:
    image: nicolargo/glances:latest
    container_name: glances
    restart: unless-stopped
    environment:
      - "GLANCES_OPT=-w"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 61208:61208
    networks:
      - dmz_net

  uptime-kuma:
    image: louislam/uptime-kuma:beta
    container_name: uptime_kuma
    restart: unless-stopped
    volumes:
      - /docker/services/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 3002:3001
    networks:
      - dmz_net

  ttyd:
    image: tsl0922/ttyd:latest
    container_name: ttyd
    restart: unless-stopped
    ports:
      - 7681:7681
    volumes:
      - /home/louis/.ssh/id_rsa:/root/.ssh/id_rsa:ro
      - /home/louis/.ssh/known_hosts:/root/.ssh/known_hosts
    entrypoint: 
      - /bin/sh
      - -c
      - |
        apt-get update && apt-get install -y openssh-client && \
        ttyd -p 7681 -W -c admin:admin ssh louis@192.168.0.75
    networks:
      - internal_net
      - dmz_net

  roundcube_app:
    image: roundcube/roundcubemail:latest
    container_name: roundcube_app
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - ROUNDCUBEMAIL_DEFAULT_HOST=${MAIL_HOST}
      - ROUNDCUBEMAIL_SMTP_SERVER=${MAIL_SMTP}
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_PORT=465
    volumes:
      - /docker/services/roundcube_app/config:/var/www/html/config
      - /docker/services/roundcube_app/data:/var/www/html/logs
    networks:
      - dmz_net
      - internal_net
    ports:
      - 8085:80

  actual_budget:
    image: actualbudget/actual-server:latest
    container_name: actual_budget
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /docker/services/actual_budget:/data
    networks:
      - dmz_net
    ports:
      - 5006:5006

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - ADVERTISED_IPs=http://192.168.0.75:32400/
    network_mode: host
    volumes:
      - /docker/services/plex/config:/config
      - ${PLEX_TV_PATH}:/tv
      - ${PLEX_MOVIES_PATH}:/movies
      - ${PLEX_CHILDREN_PATH}:/children
      - ${PLEX_PHOTOS_PATH}:/photos
      - /mnt/diskE/plex_temp:/transcode

  overseerr:
    image: sctx/overseerr:develop
    container_name: overseerr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /docker/services/overseerr:/app/config
    networks:
      - dmz_net
      - internal_net
    ports:
      - 5000:5055

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBSOCKET_ENABLED=true
      - WEBAUTH_ENABLED=true
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
    volumes:
      - /docker/services/vaultwarden:/data
    networks:
      - dmz_net
    ports:
      - 3012:3012
      - 8084:80

  nextcloud_app:
    image: nextcloud:latest
    container_name: nextcloud_app
    restart: unless-stopped
    depends_on:
      - nextcloud_db
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - MYSQL_HOST=nextcloud_db
      - MYSQL_DATABASE=${NC_DB_NAME}
      - MYSQL_USER=${NC_DB_USER}
      - MYSQL_PASSWORD=${NC_DB_PASSWORD}
    volumes:
      - /docker/services/nextcloud/app:/var/www/html 
      - /docker/services/nextcloud/apps:/var/www/html/custom_apps
      - ${NC_DATA_POOL_PATH}:/var/www/html/data 
      - /mnt/pool/Plex/:/Plex
    networks:
      - dmz_net
      - internal_net
    ports:
      - 8081:80
  redis:
    image: redis:alpine
    restart: always
    networks:
      - dmz_net
      - internal_net
    ports:
      - 6379:6379

  nextcloud_cron:
    image: nextcloud:latest
    container_name: nextcloud_cron
    restart: unless-stopped
    depends_on:
      - nextcloud_app 
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /docker/services/nextcloud/app:/var/www/html 
      - /docker/services/nextcloud/apps:/var/www/html/custom_apps
      - ${NC_DATA_POOL_PATH}:/var/www/html/data 
    entrypoint: /cron.sh
    networks:
      - dmz_net 
      - internal_net

  nextcloud_db:
    image: mariadb:10.6
    container_name: nextcloud_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${NC_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${NC_DB_NAME}
      - MYSQL_USER=${NC_DB_USER}
      - MYSQL_PASSWORD=${NC_DB_PASSWORD}
    volumes:
      - /docker/services/nextcloud/db:/var/lib/mysql
    networks:
      - internal_net

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INTERVAL=21600
    networks:
      - internal_net
      - dmz_net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /docker/services/prowlarr:/config
    networks:
      - internal_net
    ports:
      - 9696:9696

  qbittorrent:
    image: binhex/arch-qbittorrentvpn
    container_name: qbittorrent
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - VPN_PROV=${VPN_PROVIDER}
      - VPN_USER=${VPN_USERNAME}
      - VPN_PASS=${VPN_PASSWORD}
      - LAN_NETWORK=${LAN_NETWORK_CIDR}
      - OPENVPN_CONFIG=/config/openvpn/openvpn.ovpn
      - CUSTOM_DNS=8.8.8.8
    volumes:
      - /docker/services/qbittorrent:/config
      - ${DOWNLOAD_PATH}:/data
      - ${VPN_CONFIG_PATH}:/config/openvpn
    networks:
      - internal_net
      - dmz_net
    ports:
      - 8080:8080

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /docker/services/radarr:/config
      - ${PLEX_MOVIES_PATH}:/movies/movies
      - ${PLEX_CHILDREN_PATH}:/children/children
      - ${DOWNLOAD_PATH}:/downloads
    networks:
      - internal_net
    ports:
      - 7878:7878

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /docker/services/sonarr:/config
      - ${PLEX_TV_PATH}:/tv
      - ${DOWNLOAD_PATH}:/downloads
    networks:
      - internal_net
    ports:
      - 8989:8989

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /docker/services/bazarr:/config
      - ${PLEX_MOVIES_PATH}:/movies
      - ${PLEX_TV_PATH}:/tv
      - ${PLEX_CHILDREN_PATH}:/children
    networks:
      - internal_net
    ports:
      - 6767:6767

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /docker/services/tautulli:/config
    networks:
      - internal_net
    ports:
      - 8181:8181

  tdarr:
    image: haveagitgat/tdarr:latest
    container_name: tdarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - serverip=0.0.0.0
      - internalNode=true
      - nodeName=TdarrInternalNode
    volumes:
      - /docker/services/tdarr/config:/app/configs
      - /docker/services/tdarr/server:/app/server
      - ${PLEX_MOVIES_PATH}:/movies
      - ${PLEX_TV_PATH}:/tv
      - ${TDARR_TEMP_PATH}:/temp
    networks:
      - internal_net
    ports:
      - 8265:8265
      - 8266:8266

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - /docker/services/grafana:/var/lib/grafana
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    ports:
      - 3000:3000
    networks:
      - internal_net
